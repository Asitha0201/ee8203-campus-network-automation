---
global_vars:
  snmp_community: campus_snmp
  zabbix_server_ip: 10.99.99.100

routers:
  - hostname: R-CORE
    host: 10.0.0.2
    device_type: cisco_ios
    username: admin
    password_env: RCORE_PASSWORD
    secret_env: RCORE_ENABLE

    interfaces:
      - name: FastEthernet1/0
        description: LINK_TO_SW_CORE
        mode: static
        ip_address: 10.0.0.2
        subnet_mask: 255.255.255.252

      - name: FastEthernet0/0
        description: LINK_TO_R_EDGE
        mode: static
        ip_address: 10.0.10.1
        subnet_mask: 255.255.255.252

    ospf:
      process_id: 1
      router_id: 5.5.5.5
      networks:
        - "10.0.0.0 0.0.0.3 area 0"
        - "10.0.10.0 0.0.0.3 area 0"

    ssh_acl:
      name: ACL_SSH_MGMT
      rules:
        - "permit tcp 10.99.99.0 0.0.0.255 any eq 22"
        - "deny tcp any any eq 22 log"

  - hostname: R-EDGE
    host: 10.0.10.2
    device_type: cisco_ios
    username: admin
    password_env: REDGE_PASSWORD
    secret_env: REDGE_ENABLE

    interfaces:
      - name: FastEthernet0/0
        description: "LINK TO R-CORE"
        mode: static
        ip_address: 10.0.10.2
        subnet_mask: 255.255.255.252
        nat_role: inside

      - name: FastEthernet1/0
        description: INTERNET
        mode: dhcp
        nat_role: outside

    ospf:
      process_id: 1
      router_id: 6.6.6.6
      networks:
        - "10.0.10.0 0.0.0.3 area 0"
      default_information_originate: true

    nat:
      acl_name: NAT_ALLOWED
      permitted_subnets:
        - "10.10.10.0 0.0.0.255"
        - "10.10.20.0 0.0.0.255"
      inside_interface: FastEthernet0/0
      outside_interface: FastEthernet1/0

    ssh_acl:
      name: ACL_SSH_MGMT
      rules:
        - "permit tcp 10.99.99.0 0.0.0.255 any eq 22"
        - "deny tcp any any eq 22 log"

snmp_targets:
  - { hostname: SW-CORE, host: 10.99.99.1, password_env: SWCORE_PASSWORD, secret_env: SWCORE_ENABLE }
  - { hostname: SW-D-DEIE, host: 10.99.10.11, password_env: DEIE_D_PASSWORD, secret_env: DEIE_D_ENABLE }
  - { hostname: SW-A-DEIE, host: 10.99.10.21, password_env: DEIE_A_PASSWORD, secret_env: DEIE_A_ENABLE }
  - { hostname: SW-D-DCEE, host: 10.99.20.12, password_env: DCEE_D_PASSWORD, secret_env: DCEE_D_ENABLE }
  - { hostname: SW-A-DCEE, host: 10.99.20.22, password_env: DCEE_A_PASSWORD, secret_env: DCEE_A_ENABLE }
  - { hostname: SW-D-DMME, host: 10.99.30.13, password_env: DMME_D_PASSWORD, secret_env: DMME_D_ENABLE }
  - { hostname: SW-A-DMME, host: 10.99.30.23, password_env: DMME_A_PASSWORD, secret_env: DMME_A_ENABLE }
  - { hostname: SW-A-DIS, host: 10.99.99.24, password_env: DIS_A_PASSWORD, secret_env: DIS_A_ENABLE }
  - { hostname: R-CORE, host: 10.0.0.2, password_env: RCORE_PASSWORD, secret_env: RCORE_ENABLE }
  - { hostname: R-EDGE, host: 10.0.10.2, password_env: REDGE_PASSWORD, secret_env: REDGE_ENABLE }