# Device Inventory for Netmiko Python Automation
# Project: EE8203 - Campus Network Automation
# Management Plane: VLAN 99 (10.99.99.0/24)

global_vars:
  snmp_community: "campus_snmp"
  zabbix_server_ip: "10.99.99.100"
  domain_name: "foe.ruh.ac.lk"

devices:
  - hostname: "SW-CORE"
    ip: "10.99.99.1"
    device_type: "cisco_ios"
    username: "admin"
    password: "admin"
    secret: "admin"
    role: "core_switch"
    acls:
      - name: "ACL_DEIE_IN"
        type: "extended"
        rules:
          - "permit ip 10.10.10.0 0.0.0.255 10.10.40.0 0.0.0.255"
          - "permit udp host 10.99.99.100 any eq 161"
          - "permit tcp 10.99.99.0 0.0.0.255 any eq 22"
          - "permit ip any any"
        apply_to:
          - interface: "vlan 10"
            direction: "in"

      - name: "ACL_DCEE_IN"
        type: "extended"
        rules:
          - "permit tcp 10.10.20.0 0.0.0.255 10.10.40.0 0.0.0.255 eq 80"
          - "permit tcp 10.10.20.0 0.0.0.255 10.10.40.0 0.0.0.255 eq 443"
          - "deny ip 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255"
          - "deny ip 10.10.20.0 0.0.0.255 10.10.40.0 0.0.0.255"
          - "permit udp host 10.99.99.100 any eq 161"
          - "permit tcp 10.99.99.0 0.0.0.255 any eq 22"
          - "permit ip any any"
        apply_to:
          - interface: "vlan 20"
            direction: "in"

      - name: "ACL_DMME_IN"
        type: "extended"
        rules:
          - "deny ip 10.10.30.0 0.0.0.255 10.10.40.0 0.0.0.255"
          - "deny ip 10.10.30.0 0.0.0.255 10.10.20.0 0.0.0.255"
          - "permit udp host 10.99.99.100 any eq 161"
          - "permit tcp 10.99.99.0 0.0.0.255 any eq 22"
          - "permit ip any any"
        apply_to:
          - interface: "vlan 30"
            direction: "in"

  - hostname: "R-CORE"
    ip: "10.99.99.2"
    device_type: "cisco_ios"
    username: "admin"
    password: "cisco123"
    secret: "cisco123"
    role: "router"
    interfaces:
      - name: "GigabitEthernet0/0"
        description: "Link to R-EDGE"
        ip_address: "10.0.0.1"
        subnet_mask: "255.255.255.252"
      - name: "GigabitEthernet0/1"
        description: "Link to SW-CORE"
        ip_address: "10.0.0.5"
        subnet_mask: "255.255.255.252"
      - name: "GigabitEthernet0/2.99"
        description: "Management Subnet VLAN 99"
        ip_address: "10.99.99.2"
        subnet_mask: "255.255.255.0"
    ospf:
      process_id: 1
      router_id: "1.1.1.1"
      networks:
        - "10.0.0.0 0.0.0.3 area 0"
        - "10.0.0.4 0.0.0.3 area 0"
        - "10.99.99.0 0.0.0.255 area 0"

  - hostname: "R-EDGE"
    ip: "10.0.0.2"
    device_type: "cisco_ios"
    username: "admin"
    password: "cisco123"
    secret: "cisco123"
    role: "router"
    static_routes:
      - "0.0.0.0 0.0.0.0 203.0.113.1"
    interfaces:
      - name: "GigabitEthernet0/0"
        description: "Link to R-CORE"
        ip_address: "10.0.0.2"
        subnet_mask: "255.255.255.252"
      - name: "GigabitEthernet0/1"
        description: "WAN / Internet Connection"
        ip_address: "203.0.113.2"
        subnet_mask: "255.255.255.252"
    ospf:
      process_id: 1
      router_id: "2.2.2.2"
      networks:
        - "10.0.0.0 0.0.0.3 area 0"
        - "10.99.99.0 0.0.0.255 area 0"
      default_information_originate: true
    nat:
      outside_interface: "GigabitEthernet0/1"
      inside_interfaces:
        - "GigabitEthernet0/0"
      acl_name: "NAT_INTERNET_EGRESS"
      permitted_subnets:
        - "10.10.10.0 0.0.0.255"
        - "10.10.20.0 0.0.0.255"

