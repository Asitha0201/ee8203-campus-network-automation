ansible_network_os: cisco.ios.ios
ansible_become: yes
ansible_become_method: enable

# Standard Campus VLAN definitions
vlan_list:
  - id: 10
    name: VLAN_DEIE
  - id: 20
    name: VLAN_DCEE
  - id: 30
    name: VLAN_DMME
  - id: 40
    name: VLAN_DIS
  - id: 99
    name: MGMT
  - id: 100
    name: NATIVE
