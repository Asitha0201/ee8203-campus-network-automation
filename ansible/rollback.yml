---
- name: Roll back one or more access switches while preserving management
  hosts: access
  gather_facts: false
  tasks:
    - name: Reset declared end-host ports
      cisco.ios.ios_config:
        lines:
          - "default interface {{ item.interface }}"
      loop: "{{ access_ports | default([]) }}"
      
    - name: Reset declared trunk ports
      cisco.ios.ios_config:
        lines:
          - "default interface {{ item.name }}"
      loop: "{{ trunk_interfaces | default([]) }}"

- name: Roll back one or more distribution switches while preserving VLAN99
  hosts: distribution
  gather_facts: false
  tasks:
    - name: Reset the access-facing trunk only
      cisco.ios.ios_config:
        lines:
          - "default interface {{ item.name }}"
      loop: "{{ trunk_interfaces | default([]) }}"
